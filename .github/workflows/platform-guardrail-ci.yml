name: Platform Guardrail CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "platform-guardrail/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/platform-guardrail-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "platform-guardrail/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/platform-guardrail-ci.yml"

permissions:
  contents: read

jobs:
  ci:
    name: CI Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-guardrail

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Static analysis
        run: go vet ./...

      - name: Tests with race & coverage
        run: go test -race -cover ./...

      - name: Build binary
        run: go build -trimpath -o /tmp/platform-guardrail .

  cd:
    name: CD Package Artifact
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-guardrail

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false

      - name: Build Linux release binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o /tmp/platform-guardrail-linux-amd64 .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-guardrail-linux-amd64
          path: /tmp/platform-guardrail-linux-amd64
          if-no-files-found: error
          

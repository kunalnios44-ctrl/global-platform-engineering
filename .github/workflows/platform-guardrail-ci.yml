
name: Platform Guardrail CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/platform-guardrail-ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/platform-guardrail-ci.yml"

permissions:
  contents: read

jobs:
  ci:
    name: CI Verification
    runs-on: ubuntu-latest

    outputs:
      module_dir: ${{ steps.detect.outputs.module_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect Go module
        id: detect
        shell: bash
        run: |
          if [ -f "platform-guardrail/go.mod" ]; then
            MODULE_DIR="platform-guardrail"
          elif [ -f "go.mod" ]; then
            MODULE_DIR="."
          else
            mapfile -t MODULES < <(
              find . -name go.mod -not -path './.git/*' -print
            )

            if [ "${#MODULES[@]}" -eq 1 ]; then
              MODULE_DIR=$(dirname "${MODULES[0]}")
            else
              echo "::error::Go module not found or multiple modules detected."
              echo "Repository structure:"
              find . -maxdepth 3 -type f | sort | head -200
              exit 1
            fi
          fi

          echo "Detected Go module: $MODULE_DIR"
          echo "module_dir=$MODULE_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false

      - name: Verify formatting
        working-directory: ${{ steps.detect.outputs.module_dir }}
        shell: bash
        run: |
          unformatted=$(gofmt -l .)

          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

          echo "Go formatting verified."

      - name: Static analysis
        working-directory: ${{ steps.detect.outputs.module_dir }}
        run: go vet ./...

      - name: Run unit tests with race detector and coverage
        working-directory: ${{ steps.detect.outputs.module_dir }}
        run: go test -v -race -cover ./...

      - name: Build CLI binary
        working-directory: ${{ steps.detect.outputs.module_dir }}
        run: go build -trimpath -o /tmp/platform-guardrail .

      - name: Verify binary
        run: |
          test -s /tmp/platform-guardrail
          echo "CLI binary build verified."

  cd:
    name: CD Package Artifact
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false

      - name: Build Linux release binary
        working-directory: ${{ needs.ci.outputs.module_dir }}
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o /tmp/platform-guardrail-linux-amd64 .

      - name: Verify release artifact
        run: |
          test -s /tmp/platform-guardrail-linux-amd64
          file /tmp/platform-guardrail-linux-amd64

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-guardrail-linux-amd64
          path: /tmp/platform-guardrail-linux-amd64
          if-no-files-found: error
          retention-days: 30
          

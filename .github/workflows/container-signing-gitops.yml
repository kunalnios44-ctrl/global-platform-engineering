name: Global Container Signing & GitOps Delivery

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-and-gitops-gate:
    name: Container Signing & GitOps Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python for GitOps and platform checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Python automation syntax check
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          if [ -d "platform" ] && find platform -maxdepth 4 -type f -name "*.py" | grep -q .; then
            python3 -m py_compile $(find platform -maxdepth 4 -type f -name "*.py")
          fi
          echo "Python GitOps automation check clean"

      - name: Install Helm and lint charts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version
          while IFS= read -r -d '' chart_file; do
            chart_dir="$(dirname "$chart_file")"
            helm lint "$chart_dir"
          done < <(find . -maxdepth 4 -type f -name "Chart.yaml" -print0)
          echo "Helm and GitOps layout check clean"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker build context and Dockerfile if present
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          docker buildx version
          if [ -f "Dockerfile" ]; then
            docker build --check .
          else
            echo "No root Dockerfile yet; Docker buildx engine ready"
          fi

      - name: Install and verify Cosign CLI
        shell: bash
        run: |
          set -euo pipefail
          COSIGN_VERSION="v2.4.1"
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          cosign version
          echo "Cosign ready for keyless or key-based container signing"

      - name: Verify OIDC and IAM/RBAC delivery readiness
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC token request context available for delivery"
          else
            echo "OIDC token request variables absent in current trigger context"
          fi
          echo "Container Signing & GitOps gate passed cleanly"
          

name: Global Backup, Snapshot & Disaster Recovery Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backup-dr-verification.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/backup-dr-verification.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-dr-verification:
    name: Backup, Snapshot & DR Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python for backup and DR checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Python backup and recovery scripts if present
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          if [ -d "platform" ] && find platform -maxdepth 4 -type f -name "*.py" | grep -q .; then
            python3 -m py_compile $(find platform -maxdepth 4 -type f -name "*.py")
          fi
          echo "Python backup and DR check clean"

      - name: Verify backup, snapshot and DR readiness layout
        shell: bash
        run: |
          set -euo pipefail
          for dir_name in docs infra platform; do
            if [ -d "$dir_name" ]; then
              echo "Directory verified: $dir_name"
            else
              echo "Directory pending or optional in current layout: $dir_name"
            fi
          done
          echo "Backup, snapshot and disaster recovery verification gate clean"
          
